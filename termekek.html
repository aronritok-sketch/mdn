<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kínálat – Mandala</title>
  <meta name="description" content="Hangtálak, füstölők, mala láncok, szobrok, textilek és ajándékok Nepálból és Indiából – szűrhető kategória, szándék, eredet és ár szerint.">
  <meta name="theme-color" content="#1A1512">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap">

</head>
<body>
  <header id="site-header"></header>

  <main id="main">
    <div class="page-head"><div class="container">
      <nav class="crumbs" aria-label="Morzsamenü"><ol><li><a href="index.html">Kezdőlap</a></li><li><a href="termekek.html">Kínálat</a></li><li aria-current="page" data-crumb>Teljes kínálat</li></ol></nav>
      <h1 data-title>Teljes kínálat</h1>

    <div class="container shop">

              <option value="featured">Ajánlott sorrend</option>
              <option value="new">Legújabb elöl</option>
              <option value="price-asc">Ár szerint növekvő</option>
              <option value="price-desc">Ár szerint csökkenő</option>
              <option value="name">Név szerint</option>
            </select></label>
        </div>
        <div class="active-filters" data-chips></div>
        <div class="grid grid-3" data-results></div>
      </div>
    </div>

  <footer id="site-footer"></footer>
  <script type="module" src="assets/js/pages/shop.js"></script>
